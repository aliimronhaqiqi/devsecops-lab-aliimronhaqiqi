rules:
  - id: custom-sql-injection-concat
    patterns:
      - pattern-regex: '(db|conn|connection|pool)\.query\([^)]*(\+|\$\{)[^)]*\)'
    message: |
      SQL Injection: query dibangun dengan concatenation atau template literal
      yang menyertakan input user. Gunakan parameterized query.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"

  - id: custom-sql-injection-variable
    patterns:
      - pattern-regex: '(SELECT|INSERT|UPDATE|DELETE)[^;]*(\+|\$\{)[^;]*(user|id|input|param|req\.)'
    message: |
      SQL Injection: string SQL mengandung concatenation/interpolasi input user.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"

  - id: custom-hardcoded-secret
    patterns:
      - pattern-regex: '(?i)(password|passwd|pwd|secret|api_?key|apikey|token|jwt_secret|aws_secret)[a-z_]*\s*[:=]\s*["\x27][^"\x27]{5,}["\x27]'
    message: |
      Hardcoded Secret: kredensial sensitif ditulis langsung di kode.
      Pindahkan ke environment variable atau secrets manager.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"